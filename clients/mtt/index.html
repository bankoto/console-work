<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Protected report — MTT Innovations Ltd</title>
  <style>
    :root{--navy:#102f4c;--blue:#2b7ec5;--paper:#f4f7fa;--ink:#172738;--muted:#627487;--line:#d9e3ec;--risk:#a73737}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf1f7,var(--paper));color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}
    main{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:0 18px 50px rgba(16,47,76,.14)}
    .mark{width:44px;height:6px;border-radius:999px;background:var(--blue);margin-bottom:24px}
    small{color:var(--blue);font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:8px 0;font-size:1.75rem;line-height:1.15;letter-spacing:-.035em}p{margin:0 0 22px;color:var(--muted)}
    label{display:block;margin-bottom:7px;font-size:.88rem;font-weight:700}
    select,input{width:100%;border:1px solid #afc1d1;border-radius:9px;padding:12px 13px;font:inherit;color:var(--ink);background:#fff}
    select:focus,input:focus{outline:3px solid rgba(43,126,197,.18);border-color:var(--blue)}.field+.field{margin-top:14px}
    button{width:100%;margin-top:16px;border:0;border-radius:9px;padding:12px 15px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer}
    button:hover{background:#17466e}button:disabled{opacity:.65;cursor:wait}
    .error{display:none;margin:0 0 16px;border-left:4px solid var(--risk);background:#fff0f0;padding:10px 12px;color:#7e2727;border-radius:0 7px 7px 0;font-size:.88rem}.error.show{display:block}
    .privacy{margin:18px 0 0;font-size:.78rem;color:var(--muted)}.home{display:inline-block;margin-top:18px;color:var(--blue);font-size:.82rem;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="mark"></div><small>Protected financial report</small><h1>MTT Innovations Ltd</h1>
    <p>Select your access type and enter the matching password.</p>
    <p class="error" id="error" role="alert"></p>
    <form id="login">
      <div class="field"><label for="role">Access type</label><select id="role" name="role"><option value="client" selected>Client</option><option value="admin">Admin</option></select></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="submit" type="submit">Open report</button>
    </form>
    <p class="privacy">Access is limited to the sections assigned to the selected account type and remains available only in this browser tab.</p>
    <a class="home" href="/">Return to Bankoto</a>
  </main>
  <script>
    const ROOT='/clients/mtt/',SALT=hex('28afaad76335ff7fd72e692d578c6367'),SESSION_KEY='mtt-report-access-v8';
    const profiles={admin:{source:'report-admin-v8-20260911.enc',context:'MTT-Aug-2026-report-admin-v8'},client:{source:'report-client-v8-20260911.enc',context:'MTT-Aug-2026-report-client-v8'}};
    const downloads={
      'MTT_Innovations_August_2026_Management_Report.pdf':{source:'management-report-v8-20260911.pdf.enc',context:'MTT-Aug-2026-management-report-pdf-admin-v8',type:'application/pdf'},
      'MTT_Innovations_August_2026_Management_Report.docx':{source:'management-report-v8-20260911.docx.enc',context:'MTT-Aug-2026-management-report-docx-admin-v8',type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'},
      'MTT_Innovations_August_2026_Accounts_Phase_1_2.xlsx':{source:'accounts-v8-20260911.xlsx.enc',context:'MTT-Aug-2026-accounts-xlsx-admin-v8',type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
    };
    function hex(value){return new Uint8Array(value.match(/.{2}/g).map(byte=>parseInt(byte,16)))}
    function normalized(value){return value.includes('\\@')?value:value.replace('@','\\@')}
    async function derive(password){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:SALT,iterations:310000},material,{name:'AES-GCM',length:256},false,['decrypt'])}
    async function decryptFile(source,context,password){const response=await fetch(ROOT+source,{cache:'no-store'});if(!response.ok)throw new Error('The protected file is unavailable.');const payload=new Uint8Array(await response.arrayBuffer());const key=await derive(password);return crypto.subtle.decrypt({name:'AES-GCM',iv:payload.slice(0,12),additionalData:new TextEncoder().encode(context)},key,payload.slice(12))}
    async function openReport(role,password){
      const profile=profiles[role];if(!profile)throw new Error('Select a valid access type.');const plain=await decryptFile(profile.source,profile.context,password);sessionStorage.setItem(SESSION_KEY,JSON.stringify({role,password}));let report=new TextDecoder().decode(plain);report=report.replace('</head>','<base href="'+ROOT+'"><meta name="robots" content="noindex,nofollow,noarchive"></head>');
      if(role==='admin'){const bridge=`<script>const secureFiles=${JSON.stringify(downloads)};document.addEventListener('click',async event=>{const link=event.target.closest('a[download]');if(!link)return;const name=(link.getAttribute('href')||'').split('/').pop(),file=secureFiles[name];if(!file)return;event.preventDefault();const label=link.textContent;link.textContent='Preparing download…';try{const access=JSON.parse(sessionStorage.getItem('${SESSION_KEY}')||'{}'),plain=await window.decryptFile(file.source,file.context,access.password),url=URL.createObjectURL(new Blob([plain],{type:file.type})),save=document.createElement('a');save.href=url;save.download=name;save.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){alert('The download could not be opened. Please refresh and sign in again.')}finally{link.textContent=label}});<\/script>`;report=report.replace('</body>',bridge+'</body>');window.decryptFile=decryptFile}
      document.open();document.write(report);document.close()
    }
    function showError(message){const box=document.getElementById('error');box.textContent=message;box.classList.add('show')}
    document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit'),role=document.getElementById('role').value,password=normalized(document.getElementById('password').value);button.disabled=true;button.textContent='Opening…';document.getElementById('error').classList.remove('show');try{await openReport(role,password)}catch(error){sessionStorage.removeItem(SESSION_KEY);showError('The access type and password do not match.');button.disabled=false;button.textContent='Open report'}});
    try{const remembered=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(remembered?.role&&remembered?.password)openReport(remembered.role,remembered.password).catch(()=>sessionStorage.removeItem(SESSION_KEY))}catch(error){sessionStorage.removeItem(SESSION_KEY)}
  </script>
</body>
</html>
